<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1f5">
  <title>甜甜時光 ♡ 可愛時鐘</title>
  <style>
    :root { --pink:#f78ba9; --dark:#70526b; --cream:#fffdf9; --light:#ffeaf0; --shadow:0 22px 65px rgba(180,94,125,.18); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 18px; overflow-x:hidden; font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; color:var(--dark); background:radial-gradient(circle at 15% 18%,#fff8d9 0 11%,transparent 32%),radial-gradient(circle at 88% 82%,#e7f7fc 0 12%,transparent 36%),linear-gradient(135deg,#fff0f5,#f9efff 55%,#eefaff); }
    .sparkle { position:fixed; font-size:clamp(20px,4vw,38px); opacity:.55; pointer-events:none; animation:float 5s ease-in-out infinite; }
    .s1{top:10%;left:12%}.s2{top:22%;right:10%;animation-delay:-1.5s}.s3{bottom:15%;left:11%;animation-delay:-3s}.s4{bottom:10%;right:14%;animation-delay:-2s}
    @keyframes float {50% {transform:translateY(-13px) rotate(12deg)}}
    main { position:relative; width:min(100%,460px); background:rgba(255,255,255,.82); border:3px solid white; border-radius:34px; box-shadow:var(--shadow); padding:26px 26px 30px; text-align:center; backdrop-filter:blur(12px); }
    h1{font-size:clamp(23px,5vw,29px);margin:4px 0 5px;letter-spacing:.08em;color:#d66a91}
    .subtitle{font-size:14px;margin:0 0 20px;opacity:.8}
    .clock-wrap{width:min(100%,306px);margin:0 auto;position:relative;padding-top:10px}
    .ear {position:absolute;top:0;width:86px;height:99px;background:#ffd4df;border:8px solid white;border-radius:60% 60% 27% 27%;z-index:0;box-shadow:0 5px 15px #efb7cb50}
    .ear::before{content:"";position:absolute;inset:12px 18px 16px;background:#f6a3bd;border-radius:inherit}
    .ear.left{left:14px;transform:rotate(-23deg)}.ear.right{right:14px;transform:rotate(23deg)}
    .clock {position:relative;z-index:1;margin-top:44px;aspect-ratio:1;border-radius:50%;border:13px solid #fff;outline:7px solid #ffc7d8;background:radial-gradient(circle at 35% 25%,#fff,#fff7fa 70%);box-shadow:inset 0 0 20px #f7b8cd45,0 15px 30px #e7a8c25c}
    .tick{position:absolute;inset:12px;transform:rotate(calc(var(--n) * 30deg))}.tick::after{content:"";position:absolute;top:0;left:calc(50% - 2px);width:4px;height:11px;background:#e6b0c2;border-radius:9px}
    .number{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;transform:rotate(calc(var(--n) * 30deg));padding-top:28px;color:#bd7795;font-size:20px;font-weight:800}
    .number span{display:block;transform:rotate(calc(var(--n) * -30deg))}
    .hand{position:absolute;left:50%;bottom:50%;border-radius:10px;transform-origin:center bottom;transform:translateX(-50%) rotate(0deg)}
    .hour{height:24%;width:9px;background:#976783;z-index:4}.minute{height:34%;width:6px;background:#e88da8;z-index:5}.second{height:39%;width:3px;background:#f4b84c;z-index:6}
    .center{position:absolute;z-index:7;top:50%;left:50%;transform:translate(-50%,-50%);width:17px;height:17px;background:#f4b84c;border:4px solid white;border-radius:50%;box-shadow:0 1px 4px #9995}
    .face{position:absolute;inset:0;pointer-events:none;z-index:3}.eye{position:absolute;top:62%;width:7px;height:10px;border-radius:100%;background:#745267}.eye.left{left:34%}.eye.right{right:34%}.cheek{position:absolute;top:67%;width:29px;height:13px;background:#ffb8cb9c;border-radius:50%}.cheek.left{left:24%}.cheek.right{right:24%}.mouth{position:absolute;top:65%;left:50%;width:14px;height:9px;transform:translateX(-50%);border-bottom:3px solid #906176;border-radius:0 0 50% 50%}
    .digital{font-size:clamp(39px,9vw,53px);font-weight:850;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:#b96d92;margin:24px 0 4px}
    .seconds{font-size:.55em;color:#e4a0b7}.date{font-size:16px;font-weight:700;margin-top:4px}.message{margin:18px 0 0;padding:12px 16px;border-radius:18px;background:#fff0f5;color:#bb7395;font-size:14px}
    .controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:18px}.controls button{border:0;padding:10px 17px;background:#f8d3e1;color:#945e77;border-radius:999px;font:700 13px inherit;cursor:pointer;transition:transform .2s,background .2s}.controls button:hover{transform:translateY(-2px);background:#f4b9ce}.controls button[aria-pressed="true"]{background:#db83a5;color:white}
    footer{font-size:11px;opacity:.55;margin-top:18px}
    @media (prefers-reduced-motion:reduce){.sparkle{animation:none}}
  </style>
</head>
<body>
  <div class="sparkle s1" aria-hidden="true">✿</div><div class="sparkle s2" aria-hidden="true">✦</div><div class="sparkle s3" aria-hidden="true">♡</div><div class="sparkle s4" aria-hidden="true">✿</div>
  <main>
    <h1>♡ 甜甜時光 ♡</h1>
    <p class="subtitle">每一秒，都是可愛的小日子 ☁️</p>
    <div class="clock-wrap">
      <div class="ear left" aria-hidden="true"></div><div class="ear right" aria-hidden="true"></div>
      <div class="clock" role="img" aria-label="即時更新的可愛兔兔指針時鐘" id="clock">
        <div class="tick" style="--n:0"></div><div class="tick" style="--n:1"></div><div class="tick" style="--n:2"></div><div class="tick" style="--n:3"></div><div class="tick" style="--n:4"></div><div class="tick" style="--n:5"></div><div class="tick" style="--n:6"></div><div class="tick" style="--n:7"></div><div class="tick" style="--n:8"></div><div class="tick" style="--n:9"></div><div class="tick" style="--n:10"></div><div class="tick" style="--n:11"></div>
        <div class="number" style="--n:0"><span>12</span></div><div class="number" style="--n:1"><span>1</span></div><div class="number" style="--n:2"><span>2</span></div><div class="number" style="--n:3"><span>3</span></div><div class="number" style="--n:4"><span>4</span></div><div class="number" style="--n:5"><span>5</span></div><div class="number" style="--n:6"><span>6</span></div><div class="number" style="--n:7"><span>7</span></div><div class="number" style="--n:8"><span>8</span></div><div class="number" style="--n:9"><span>9</span></div><div class="number" style="--n:10"><span>10</span></div><div class="number" style="--n:11"><span>11</span></div>
        <div class="face"><i class="eye left"></i><i class="eye right"></i><i class="cheek left"></i><i class="cheek right"></i><i class="mouth"></i></div>
        <div class="hand hour" id="hour"></div><div class="hand minute" id="minute"></div><div class="hand second" id="second"></div><div class="center"></div>
      </div>
    </div>
    <div class="digital" aria-live="off"><span id="time">--:--</span><span class="seconds" id="sec">:--</span></div>
    <div class="date" id="date">正在讀取日期…</div>
    <p class="message" id="message">今天也要開開心心 ♡</p>
    <div class="controls"><button id="format" type="button" aria-pressed="false">24 小時制</button><button id="seconds-toggle" type="button" aria-pressed="true">顯示秒數</button></div>
    <footer>時間依照你的裝置時區自動顯示 ✨</footer>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let use24 = false, showSeconds = true;
    const pad = n => String(n).padStart(2,'0');
    const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    function update() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();
      $('hour').style.transform = `translateX(-50%) rotate(${(h%12)*30 + m*.5+s/120}deg)`;
      $('minute').style.transform = `translateX(-50%) rotate(${m*6+s*.1}deg)`;
      $('second').style.transform = `translateX(-50%) rotate(${s*6+ms*.006}deg)`;
      const displayed = use24 ? pad(h) : pad(h%12 || 12);
      $('time').textContent = `${use24 ? '' : (h<12?'上午 ':'下午 ')}${displayed}:${pad(m)}`;
      $('sec').textContent = `:${pad(s)}`;
      $('sec').hidden = !showSeconds;
      $('date').textContent = `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日・${weekdays[now.getDay()]}`;
      $('message').textContent = h < 5 ? '夜深了，願你有甜甜的好夢 🌙' : h < 11 ? '早安！今天也是閃亮的一天 ☀️' : h < 17 ? '午後的小確幸，記得喝口水 🌷' : h < 21 ? '傍晚好，辛苦一天的你最棒 ♡' : '晚安，讓心情慢慢放鬆 ✨';
    }
    $('format').addEventListener('click',()=>{use24=!use24;$('format').setAttribute('aria-pressed',String(use24));$('format').textContent=use24?'12 小時制':'24 小時制';update();});
    $('seconds-toggle').addEventListener('click',()=>{showSeconds=!showSeconds;$('seconds-toggle').setAttribute('aria-pressed',String(showSeconds));$('seconds-toggle').textContent=showSeconds?'隱藏秒數':'顯示秒數';update();});
    update();setInterval(update,100);
  </script>
</body>
</html>
