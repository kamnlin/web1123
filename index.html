<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO-OS // 科技風數位時鐘</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入科幻數位字體 (Orbitron, JetBrains Mono) 與中文無襯線字體 (Noto Sans TC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- 擴充 Tailwind 設定：字體、動畫與背景格線 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        tech: ['"Orbitron"', 'monospace'],
                        mono: ['"JetBrains Mono"', '"Noto Sans TC"', 'monospace'],
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    keyframes: {
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(1000%)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.4' },
                        },
                        rippleOut: {
                            '0%': { transform: 'scale(0.95)', opacity: '0.8' },
                            '100%': { transform: 'scale(1.06)', opacity: '0' },
                        }
                    },
                    animation: {
                        'scan': 'scanline 6s linear infinite',
                        'pulse-fast': 'pulseGlow 1.5s ease-in-out infinite',
                        'ripple': 'rippleOut 0.6s ease-out forwards',
                    }
                }
            }
        }
    </script>
</head>
<body id="page-body" class="font-mono min-h-screen w-full bg-slate-950 text-cyan-400 flex flex-col items-center justify-center p-4 sm:p-6 overflow-x-hidden select-none relative transition-colors duration-500">

    <!-- 科技感背景網格與環境光暈 -->
    <div class="pointer-events-none fixed inset-0 z-0 opacity-20 bg-[linear-gradient(to_right,#334155_1px,transparent_1px),linear-gradient(to_bottom,#334155_1px,transparent_1px)] bg-[size:32px_32px]"></div>
    <div id="ambient-glow" class="pointer-events-none fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[85vw] max-w-2xl h-[60vh] rounded-full blur-[120px] opacity-20 bg-cyan-500 transition-colors duration-700 z-0"></div>

    <!-- 主 HUD 儀表板容器 -->
    <main id="hud-panel" class="relative z-10 w-full max-w-2xl bg-slate-900/80 backdrop-blur-xl rounded-3xl border border-cyan-500/40 shadow-[0_0_50px_rgba(6,182,212,0.18)] p-5 sm:p-8 overflow-hidden transition-all duration-500">
        
        <!-- 掃描線光束裝飾 -->
        <div id="scan-beam" class="pointer-events-none absolute inset-x-0 top-0 h-16 bg-gradient-to-b from-transparent via-cyan-400/10 to-transparent animate-scan z-0"></div>

        <!-- 四角科技瞄準裝飾框 -->
        <div id="corner-tl" class="pointer-events-none absolute top-3 left-3 w-5 h-5 border-t-2 border-l-2 border-cyan-400 rounded-tl-lg transition-colors duration-500"></div>
        <div id="corner-tr" class="pointer-events-none absolute top-3 right-3 w-5 h-5 border-t-2 border-r-2 border-cyan-400 rounded-tr-lg transition-colors duration-500"></div>
        <div id="corner-bl" class="pointer-events-none absolute bottom-3 left-3 w-5 h-5 border-b-2 border-l-2 border-cyan-400 rounded-bl-lg transition-colors duration-500"></div>
        <div id="corner-br" class="pointer-events-none absolute bottom-3 right-3 w-5 h-5 border-b-2 border-r-2 border-cyan-400 rounded-br-lg transition-colors duration-500"></div>

        <!-- 頂部系統狀態列 -->
        <header class="relative z-10 flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-800/90">
            <div class="flex items-center gap-2.5">
                <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_10px_currentColor] animate-pulse-fast"></span>
                <span class="text-xs sm:text-sm font-bold tracking-[0.2em] uppercase">CHRONO-OS // V4.2</span>
            </div>

            <!-- 功能切換按鈕組 -->
            <div class="flex items-center gap-2">
                <button id="sound-btn" type="button" aria-label="切換科技脈衝音效"
                    class="px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 border border-cyan-500/30 text-xs font-bold tracking-wider transition-all active:scale-95 flex items-center gap-1.5">
                    <span id="sound-indicator" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="sound-label">SFX: OFF</span>
                </button>
                <button id="format-btn" type="button" aria-label="切換 12 或 24 小時制"
                    class="px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 border border-cyan-500/30 text-xs font-bold tracking-wider transition-all active:scale-95">
                    MODE: 24H
                </button>
            </div>
        </header>

        <!-- 核心數位時間顯示區 (點擊觸發同步脈衝特效) -->
        <section class="relative z-10 my-6 sm:my-8">
            <button id="clock-trigger" type="button" aria-label="點擊執行時間校準脈衝"
                class="group relative w-full py-6 sm:py-8 px-3 sm:px-6 rounded-2xl bg-slate-950/75 border border-cyan-500/25 hover:border-cyan-400/60 transition-all duration-300 focus:outline-none overflow-hidden cursor-pointer">
                
                <!-- 點擊擴散波紋容器 -->
                <div id="pulse-layer" class="pointer-events-none absolute inset-0 rounded-2xl"></div>

                <!-- 上方微資訊列 -->
                <div class="flex items-center justify-between text-[10px] sm:text-xs tracking-[0.2em] opacity-70 mb-3 px-1">
                    <span id="sync-status">SYNC: ATOMIC_LOCK</span>
                    <span id="timezone-label">UTC+08:00</span>
                </div>

                <!-- 大型電子數字時間 -->
                <div class="flex items-baseline justify-center gap-1 sm:gap-2 font-tech">
                    <span id="time-hms" class="text-4xl sm:text-6xl md:text-7xl font-black tracking-widest drop-shadow-[0_0_18px_rgba(34,211,238,0.65)] transition-all duration-300">
                        00:00:00
                    </span>
                    <div class="flex flex-col items-start justify-end min-w-[3rem] sm:min-w-[4rem]">
                        <span id="time-ampm" class="text-xs sm:text-sm font-bold tracking-widest opacity-85 hidden">AM</span>
                        <span id="time-ms" class="text-lg sm:text-2xl font-bold opacity-80">.00</span>
                    </div>
                </div>

                <!-- 60秒動態發光進度條 -->
                <div class="mt-6 w-full">
                    <div class="flex justify-between text-[10px] tracking-widest opacity-60 mb-1.5">
                        <span>SEC.CYCLE</span>
                        <span id="sec-percent">00%</span>
                    </div>
                    <div class="w-full h-2 rounded-full bg-slate-800/90 overflow-hidden p-0.5 border border-slate-700/60">
                        <div id="sec-progress" class="h-full w-0 rounded-full bg-cyan-400 shadow-[0_0_12px_currentColor] transition-[width] duration-75 ease-linear"></div>
                    </div>
                </div>
            </button>
        </section>

        <!-- 數據資訊儀表卡：日期、星期、當日進度 -->
        <section class="relative z-10 grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
            <!-- 日期模組 -->
            <div class="info-card rounded-2xl bg-slate-950/60 border border-slate-800 p-3.5 flex flex-col justify-between transition-colors duration-500">
                <span class="text-[10px] tracking-[0.2em] opacity-60 uppercase">DATE // 日期</span>
                <span id="date-display" class="mt-1 text-base sm:text-lg font-bold tracking-wider">2026-11-23</span>
            </div>

            <!-- 星期與時段模組 -->
            <div class="info-card rounded-2xl bg-slate-950/60 border border-slate-800 p-3.5 flex flex-col justify-between transition-colors duration-500">
                <span class="text-[10px] tracking-[0.2em] opacity-60 uppercase">DAY // 星期</span>
                <div class="mt-1 flex items-center justify-between">
                    <span id="weekday-display" class="text-base sm:text-lg font-bold">星期一</span>
                    <span id="weekday-en" class="text-xs font-tech opacity-75">MON</span>
                </div>
            </div>

            <!-- 當日進度模組 -->
            <div class="info-card rounded-2xl bg-slate-950/60 border border-slate-800 p-3.5 flex flex-col justify-between transition-colors duration-500">
                <div class="flex items-center justify-between text-[10px] tracking-[0.2em] opacity-60 uppercase">
                    <span>DAY.PROG</span>
                    <span id="day-percent">0.0%</span>
                </div>
                <div class="mt-2.5 w-full h-1.5 rounded-full bg-slate-800 overflow-hidden">
                    <div id="day-progress-bar" class="h-full w-0 rounded-full bg-cyan-400 transition-all duration-500"></div>
                </div>
            </div>
        </section>

        <!-- 霓虹主題配色切換列 -->
        <footer class="relative z-10 pt-4 border-t border-slate-800/90 flex flex-col sm:flex-row items-center justify-between gap-3">
            <span class="text-[11px] tracking-[0.18em] opacity-65 uppercase">COLOR_MATRIX // 主題切換</span>
            <div class="grid grid-cols-4 gap-2 w-full sm:w-auto">
                <button type="button" data-theme="cyan"
                    class="theme-btn px-3 py-2 rounded-xl text-xs font-bold tracking-wider bg-cyan-500/15 border border-cyan-400 text-cyan-300 hover:bg-cyan-500/25 transition-all active:scale-95">
                    CYAN
                </button>
                <button type="button" data-theme="emerald"
                    class="theme-btn px-3 py-2 rounded-xl text-xs font-bold tracking-wider bg-emerald-500/10 border border-slate-700 text-emerald-400 hover:bg-emerald-500/20 transition-all active:scale-95">
                    MATRIX
                </button>
                <button type="button" data-theme="fuchsia"
                    class="theme-btn px-3 py-2 rounded-xl text-xs font-bold tracking-wider bg-fuchsia-500/10 border border-slate-700 text-fuchsia-400 hover:bg-fuchsia-500/20 transition-all active:scale-95">
                    PLASMA
                </button>
                <button type="button" data-theme="amber"
                    class="theme-btn px-3 py-2 rounded-xl text-xs font-bold tracking-wider bg-amber-500/10 border border-slate-700 text-amber-400 hover:bg-amber-500/20 transition-all active:scale-95">
                    SOLAR
                </button>
            </div>
        </footer>
    </main>

    <!-- 底部微型系統提示 -->
    <p id="footer-hint" class="relative z-10 mt-5 text-[11px] tracking-[0.2em] opacity-55 text-center uppercase">
        CLICK TIME DISPLAY TO TRIGGER PULSE SYNC
    </p>

    <script>
        /**
         * CHRONO-OS 科技風數位時鐘核心程式
         * 功能：毫秒級數位時鐘、60秒/當日進度條、4款霓虹主題切換、Web Audio 科幻合成音效
         */

        // ==========================================
        // 1. 狀態與科技主題配置
        // ==========================================
        let is24Hour = true;
        let isSoundEnabled = false;
        let currentTheme = 'cyan';
        let lastSecond = -1;
        let audioCtx = null;
        let syncResetTimer = null;

        const WEEKDAYS_ZH = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        const WEEKDAYS_EN = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

        // 四款科技霓虹配色定義
        const TECH_THEMES = {
            cyan: {
                text: 'text-cyan-400',
                glowBg: 'bg-cyan-500',
                panelBorder: 'border-cyan-500/40 shadow-[0_0_50px_rgba(6,182,212,0.18)]',
                scanBeam: 'via-cyan-400/10',
                corner: 'border-cyan-400',
                dot: 'bg-cyan-400',
                btnBorder: 'border-cyan-500/30',
                triggerBorder: 'border-cyan-500/25 hover:border-cyan-400/60',
                hmsGlow: 'drop-shadow-[0_0_18px_rgba(34,211,238,0.65)]',
                barBg: 'bg-cyan-400',
                activeThemeBtn: 'border-cyan-400 bg-cyan-500/20 ring-1 ring-cyan-400'
            },
            emerald: {
                text: 'text-emerald-400',
                glowBg: 'bg-emerald-500',
                panelBorder: 'border-emerald-500/40 shadow-[0_0_50px_rgba(16,185,129,0.18)]',
                scanBeam: 'via-emerald-400/10',
                corner: 'border-emerald-400',
                dot: 'bg-emerald-400',
                btnBorder: 'border-emerald-500/30',
                triggerBorder: 'border-emerald-500/25 hover:border-emerald-400/60',
                hmsGlow: 'drop-shadow-[0_0_18px_rgba(52,211,153,0.65)]',
                barBg: 'bg-emerald-400',
                activeThemeBtn: 'border-emerald-400 bg-emerald-500/20 ring-1 ring-emerald-400'
            },
            fuchsia: {
                text: 'text-fuchsia-400',
                glowBg: 'bg-fuchsia-500',
                panelBorder: 'border-fuchsia-500/40 shadow-[0_0_50px_rgba(217,70,239,0.2)]',
                scanBeam: 'via-fuchsia-400/10',
                corner: 'border-fuchsia-400',
                dot: 'bg-fuchsia-400',
                btnBorder: 'border-fuchsia-500/30',
                triggerBorder: 'border-fuchsia-500/25 hover:border-fuchsia-400/60',
                hmsGlow: 'drop-shadow-[0_0_18px_rgba(232,121,249,0.65)]',
                barBg: 'bg-fuchsia-400',
                activeThemeBtn: 'border-fuchsia-400 bg-fuchsia-500/20 ring-1 ring-fuchsia-400'
            },
            amber: {
                text: 'text-amber-400',
                glowBg: 'bg-amber-500',
                panelBorder: 'border-amber-500/40 shadow-[0_0_50px_rgba(245,158,11,0.18)]',
                scanBeam: 'via-amber-400/10',
                corner: 'border-amber-400',
                dot: 'bg-amber-400',
                btnBorder: 'border-amber-500/30',
                triggerBorder: 'border-amber-500/25 hover:border-amber-400/60',
                hmsGlow: 'drop-shadow-[0_0_18px_rgba(251,191,36,0.65)]',
                barBg: 'bg-amber-400',
                activeThemeBtn: 'border-amber-400 bg-amber-500/20 ring-1 ring-amber-400'
            }
        };

        // ==========================================
        // 2. DOM 元素快取
        // ==========================================
        const el = {
            body: document.getElementById('page-body'),
            ambientGlow: document.getElementById('ambient-glow'),
            hudPanel: document.getElementById('hud-panel'),
            scanBeam: document.getElementById('scan-beam'),
            corners: [
                document.getElementById('corner-tl'),
                document.getElementById('corner-tr'),
                document.getElementById('corner-bl'),
                document.getElementById('corner-br')
            ],
            statusDot: document.getElementById('status-dot'),
            soundBtn: document.getElementById('sound-btn'),
            soundIndicator: document.getElementById('sound-indicator'),
            soundLabel: document.getElementById('sound-label'),
            formatBtn: document.getElementById('format-btn'),
            clockTrigger: document.getElementById('clock-trigger'),
            pulseLayer: document.getElementById('pulse-layer'),
            syncStatus: document.getElementById('sync-status'),
            timezoneLabel: document.getElementById('timezone-label'),
            timeHms: document.getElementById('time-hms'),
            timeAmpm: document.getElementById('time-ampm'),
            timeMs: document.getElementById('time-ms'),
            secPercent: document.getElementById('sec-percent'),
            secProgress: document.getElementById('sec-progress'),
            dateDisplay: document.getElementById('date-display'),
            weekdayDisplay: document.getElementById('weekday-display'),
            weekdayEn: document.getElementById('weekday-en'),
            dayPercent: document.getElementById('day-percent'),
            dayProgressBar: document.getElementById('day-progress-bar'),
            themeBtns: document.querySelectorAll('.theme-btn')
        };

        // ==========================================
        // 3. Web Audio 科幻合成音效
        // ==========================================
        function ensureAudioContext() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (err) {
                console.warn('音訊初始化略過:', err);
            }
        }

        // 電子秒針脈衝滴答聲
        function playTechTick() {
            if (!isSoundEnabled || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(480, now + 0.02);

                gain.gain.setValueAtTime(0.025, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.03);
            } catch (err) {
                // 忽略自動播放限制
            }
        }

        // 點擊校準 / 切換按鈕科幻提示音
        function playSciFiBeep(freqStart = 880, freqEnd = 1320) {
            ensureAudioContext();
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freqStart, now);
                osc.frequency.exponentialRampToValueAtTime(freqEnd, now + 0.09);

                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.13);
            } catch (err) {
                console.warn('提示音播放略過:', err);
            }
        }

        // ==========================================
        // 4. 套用科技主題配色
        // ==========================================
        function applyTheme(themeKey) {
            const t = TECH_THEMES[themeKey] || TECH_THEMES.cyan;
            currentTheme = themeKey;

            el.body.className = `font-mono min-h-screen w-full bg-slate-950 flex flex-col items-center justify-center p-4 sm:p-6 overflow-x-hidden select-none relative transition-colors duration-500 ${t.text}`;
            el.ambientGlow.className = `pointer-events-none fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[85vw] max-w-2xl h-[60vh] rounded-full blur-[120px] opacity-20 transition-colors duration-700 z-0 ${t.glowBg}`;
            el.hudPanel.className = `relative z-10 w-full max-w-2xl bg-slate-900/80 backdrop-blur-xl rounded-3xl border p-5 sm:p-8 overflow-hidden transition-all duration-500 ${t.panelBorder}`;
            el.scanBeam.className = `pointer-events-none absolute inset-x-0 top-0 h-16 bg-gradient-to-b from-transparent to-transparent animate-scan z-0 ${t.scanBeam}`;

            const cornerBase = [
                'pointer-events-none absolute top-3 left-3 w-5 h-5 border-t-2 border-l-2 rounded-tl-lg transition-colors duration-500',
                'pointer-events-none absolute top-3 right-3 w-5 h-5 border-t-2 border-r-2 rounded-tr-lg transition-colors duration-500',
                'pointer-events-none absolute bottom-3 left-3 w-5 h-5 border-b-2 border-l-2 rounded-bl-lg transition-colors duration-500',
                'pointer-events-none absolute bottom-3 right-3 w-5 h-5 border-b-2 border-r-2 rounded-br-lg transition-colors duration-500'
            ];
            el.corners.forEach((c, i) => {
                c.className = `${cornerBase[i]} ${t.corner}`;
            });

            el.statusDot.className = `w-2.5 h-2.5 rounded-full shadow-[0_0_10px_currentColor] animate-pulse-fast ${t.dot}`;
            el.soundBtn.className = `px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 border text-xs font-bold tracking-wider transition-all active:scale-95 flex items-center gap-1.5 ${t.btnBorder}`;
            el.formatBtn.className = `px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 border text-xs font-bold tracking-wider transition-all active:scale-95 ${t.btnBorder}`;
            el.clockTrigger.className = `group relative w-full py-6 sm:py-8 px-3 sm:px-6 rounded-2xl bg-slate-950/75 border transition-all duration-300 focus:outline-none overflow-hidden cursor-pointer ${t.triggerBorder}`;
            el.timeHms.className = `text-4xl sm:text-6xl md:text-7xl font-black tracking-widest transition-all duration-300 ${t.hmsGlow}`;
            el.secProgress.className = `h-full rounded-full shadow-[0_0_12px_currentColor] transition-[width] duration-75 ease-linear ${t.barBg}`;
            el.dayProgressBar.className = `h-full rounded-full transition-all duration-500 ${t.barBg}`;

            // 更新音效指示燈狀態
            el.soundIndicator.className = `w-2 h-2 rounded-full ${isSoundEnabled ? t.dot + ' shadow-[0_0_8px_currentColor]' : 'bg-slate-500'}`;

            // 更新主題按鈕選中狀態
            el.themeBtns.forEach(btn => {
                const key = btn.dataset.theme;
                const isSelected = key === themeKey;
                const baseColors = {
                    cyan: 'text-cyan-300 hover:bg-cyan-500/25',
                    emerald: 'text-emerald-400 hover:bg-emerald-500/20',
                    fuchsia: 'text-fuchsia-400 hover:bg-fuchsia-500/20',
                    amber: 'text-amber-400 hover:bg-amber-500/20'
                };
                btn.className = `theme-btn px-3 py-2 rounded-xl text-xs font-bold tracking-wider border transition-all active:scale-95 ${baseColors[key]} ${isSelected ? TECH_THEMES[key].activeThemeBtn : 'bg-slate-950/60 border-slate-700'}`;
            });
        }

        // ==========================================
        // 5. 高精度即時數位時鐘主迴圈
        // ==========================================
        function updateTimezoneLabel() {
            try {
                const offsetMinutes = -new Date().getTimezoneOffset();
                const sign = offsetMinutes >= 0 ? '+' : '-';
                const absMin = Math.abs(offsetMinutes);
                const hrs = String(Math.floor(absMin / 60)).padStart(2, '0');
                const mins = String(absMin % 60).padStart(2, '0');
                el.timezoneLabel.textContent = `UTC${sign}${hrs}:${mins}`;
            } catch (err) {
                el.timezoneLabel.textContent = 'UTC+08:00';
            }
        }

        function updateClockLoop() {
            try {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                const ms = now.getMilliseconds();

                // 更新毫秒 (2位數高速跳動) 與 60秒滑順進度條
                const msTwoDigits = String(Math.floor(ms / 10)).padStart(2, '0');
                el.timeMs.textContent = `.${msTwoDigits}`;

                const secRatio = ((seconds + ms / 1000) / 60) * 100;
                el.secProgress.style.width = `${secRatio.toFixed(2)}%`;

                // 每秒更新一次主要數字、日期與當日進度
                if (seconds !== lastSecond) {
                    lastSecond = seconds;
                    playTechTick();

                    let displayHour = hours;
                    if (!is24Hour) {
                        el.timeAmpm.textContent = hours >= 12 ? 'PM' : 'AM';
                        el.timeAmpm.classList.remove('hidden');
                        displayHour = hours % 12 || 12;
                    } else {
                        el.timeAmpm.classList.add('hidden');
                    }

                    const pad = n => String(n).padStart(2, '0');
                    el.timeHms.textContent = `${pad(displayHour)}:${pad(minutes)}:${pad(seconds)}`;
                    el.secPercent.textContent = `${String(Math.round((seconds / 59) * 100)).padStart(2, '0')}%`;

                    // 更新日期與星期
                    const year = now.getFullYear();
                    const month = pad(now.getMonth() + 1);
                    const day = pad(now.getDate());
                    el.dateDisplay.textContent = `${year}-${month}-${day}`;
                    el.weekdayDisplay.textContent = WEEKDAYS_ZH[now.getDay()];
                    el.weekdayEn.textContent = WEEKDAYS_EN[now.getDay()];

                    // 計算當日已過百分比
                    const totalSecondsPassed = hours * 3600 + minutes * 60 + seconds;
                    const dayRatio = (totalSecondsPassed / 86400) * 100;
                    el.dayPercent.textContent = `${dayRatio.toFixed(1)}%`;
                    el.dayProgressBar.style.width = `${dayRatio.toFixed(2)}%`;
                }
            } catch (err) {
                console.error('時鐘運算錯誤:', err);
            }

            requestAnimationFrame(updateClockLoop);
        }

        // ==========================================
        // 6. 互動事件：點擊校準脈衝、音效與格式切換
        // ==========================================
        el.clockTrigger.addEventListener('click', () => {
            playSciFiBeep(720, 1440);

            // 產生科技波紋特效
            const ripple = document.createElement('div');
            ripple.className = `absolute inset-0 rounded-2xl border-2 ${TECH_THEMES[currentTheme].corner} animate-ripple`;
            el.pulseLayer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 650);

            // 暫時切換狀態文字回饋
            el.syncStatus.textContent = 'SYNC: RECALIBRATED_OK';
            clearTimeout(syncResetTimer);
            syncResetTimer = setTimeout(() => {
                el.syncStatus.textContent = 'SYNC: ATOMIC_LOCK';
            }, 1500);
        });

        el.formatBtn.addEventListener('click', () => {
            playSciFiBeep(640, 880);
            is24Hour = !is24Hour;
            el.formatBtn.textContent = is24Hour ? 'MODE: 24H' : 'MODE: 12H';
            lastSecond = -1; // 強制即時更新顯示
        });

        el.soundBtn.addEventListener('click', () => {
            ensureAudioContext();
            isSoundEnabled = !isSoundEnabled;
            el.soundLabel.textContent = isSoundEnabled ? 'SFX: ON' : 'SFX: OFF';
            applyTheme(currentTheme);
            if (isSoundEnabled) {
                playSciFiBeep(900, 1200);
            }
        });

        el.themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                playSciFiBeep(520, 980);
                applyTheme(btn.dataset.theme);
            });
        });

        // 頁面載入後初始化
        window.addEventListener('DOMContentLoaded', () => {
            updateTimezoneLabel();
            applyTheme('cyan');
            requestAnimationFrame(updateClockLoop);
        });
    </script>
</body>
</html>
