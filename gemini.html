<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛療癒時鐘 | Kawaii Clock</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入圓潤可愛的中英文字體 (Zen Maru Gothic & Nunito) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- 自訂 Tailwind 設定，將字體與可愛動畫整合為 Utility Classes -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cute: ['"Zen Maru Gothic"', '"Nunito"', 'sans-serif'],
                    },
                    keyframes: {
                        floatSlow: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        floatUp: {
                            '0%': { transform: 'translateY(0) scale(0.8)', opacity: '1' },
                            '100%': { transform: 'translateY(-60px) scale(1.3)', opacity: '0' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        },
                        blink: {
                            '0%, 92%, 100%': { transform: 'scaleY(1)' },
                            '96%': { transform: 'scaleY(0.1)' },
                        }
                    },
                    animation: {
                        'float-slow': 'floatSlow 4s ease-in-out infinite',
                        'float-up': 'floatUp 1s ease-out forwards',
                        'wiggle-soft': 'wiggle 2.5s ease-in-out infinite',
                        'blink-eyes': 'blink 4.5s infinite',
                    }
                }
            }
        }
    </script>
</head>
<body id="page-body" class="font-cute min-h-screen w-full flex flex-col items-center justify-center p-4 sm:p-6 transition-colors duration-700 bg-pink-50 text-pink-900 overflow-x-hidden select-none relative">

    <!-- 背景飄浮裝飾元素 -->

        <div class="absolute top-10 left-8 text-4xl sm:text-5xl animate-float-slow">☁️</div>
        <div class="absolute top-24 right-10 text-3xl sm:text-4xl animate-float-slow" style="animation-delay: 1.2s;">✨</div>
        <div class="absolute bottom-16 left-12 text-3xl sm:text-4xl animate-float-slow" style="animation-delay: 0.7s;">🌸</div>
        <div class="absolute bottom-20 right-14 text-4xl sm:text-5xl animate-float-slow" style="animation-delay: 2s;">☁️</div>
    </div>

    <!-- 主容器卡片 -->

        <!-- 頂部問候語與狀態列 -->

                <span id="greeting-text">早安呀！</span>
            </div>

            <!-- 音效與格式控制按鈕 -->
            <div class="flex items-center gap-2">
                <button id="sound-toggle" type="button" aria-label="切換滴答音效" title="開啟/關閉輕柔滴答聲"

                    <span id="sound-icon" class="text-lg leading-none">🔇</span>
                </button>
                <button id="format-toggle" type="button" aria-label="切換12或24小時制" title="切換 12 / 24 小時制"
                    class="px-3 py-2 rounded-full bg-pink-100 hover:bg-pink-200 text-pink-700 font-extrabold text-xs sm:text-sm transition-all active:scale-90 shadow-sm">
                    24H

                    <!-- 左耳 -->

                        <div id="ear-left-inner" class="w-7 h-7 sm:w-8 sm:h-8 bg-pink-100 rounded-t-full rounded-bl-xl transition-colors duration-500"></div>
                    </div>

                        <g id="clock-markers" class="transition-colors duration-500"></g>

                        <!-- 可愛表情層 (位於錶盤中下方，避免完全被指針遮擋) -->
                        <g id="kawaii-face" transform="translate(120, 148)">
                            <!-- 腮紅 -->
                            <ellipse id="cheek-left" cx="-34" cy="4" rx="10" ry="6" fill="#fda4af" opacity="0.7" />
                            <ellipse id="cheek-right" cx="34" cy="4" rx="10" ry="6" fill="#fda4af" opacity="0.7" />

                            <!-- 一般眨眼狀態 -->

                earOuter: 'bg-emerald-300 border-emerald-400 rounded-t-full scale-y-125 -translate-y-2',

        // 星期對照表
        const WEEKDAYS_ZH = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

        // ==========================================
        // 2. DOM 元素參照

        const elements = {
            body: document.getElementById('page-body'),
            card: document.getElementById('main-card'),

        };

        // ==========================================
        // 3. Web Audio 輕柔音效工具 (無需外部音檔)
        // ==========================================
        function initAudioContext() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (err) {
                console.warn('音訊初始化失敗:', err);
            }
        }

        // 輕柔滴答聲
        function playSoftTick() {
            if (!isSoundEnabled || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(680, now);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.035);

                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.045);
            } catch (err) {
                // 忽略瀏覽器音訊播放限制錯誤
            }
        }

        // 被摸摸時的可愛叮咚音效
        function playHappyChime() {
            initAudioContext();
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99]; // C5, E5, G5 和弦琶音
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.06);

                    gain.gain.setValueAtTime(0.001, now + idx * 0.06);
                    gain.gain.linearRampToValueAtTime(0.07, now + idx * 0.06 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.06);
                    osc.stop(now + idx * 0.06 + 0.28);
                });
            } catch (err) {
                console.warn('無法播放互動音效:', err);
            }
        }

        // ==========================================
        // 4. 繪製指針時鐘刻度與數字
        // ==========================================
        function buildClockMarkers(themeSvg) {
            const svgNS = 'http://www.w3.org/2000/svg';
            elements.markersGroup.innerHTML = '';

            for (let i = 1; i <= 12; i++) {
                const angleRad = ((i * 30) - 90) * (Math.PI / 180);
                const radius = 92;
                const x = 120 + radius * Math.cos(angleRad);
                const y = 120 + radius * Math.sin(angleRad);

                // 3, 6, 9, 12 顯示圓潤可愛數字，其餘顯示柔和圓點
                if (i % 3 === 0) {
                    const text = document.createElementNS(svgNS, 'text');
                    text.setAttribute('x', x);
                    text.setAttribute('y', y + 6);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('fill', themeSvg.markerNum);
                    text.setAttribute('font-size', '18');
                    text.setAttribute('font-weight', '800');
                    text.textContent = i.toString();
                    elements.markersGroup.appendChild(text);
                } else {
                    const dot = document.createElementNS(svgNS, 'circle');
                    dot.setAttribute('cx', x);
                    dot.setAttribute('cy', y);
                    dot.setAttribute('r', '4');
                    dot.setAttribute('fill', themeSvg.markerDot);
                    elements.markersGroup.appendChild(dot);
                }
            }
        }

        // ==========================================
        // 5. 套用主題樣式
        // ==========================================
        function applyTheme(themeKey) {
            const theme = THEMES[themeKey] || THEMES.strawberry;
            currentThemeKey = themeKey;

            // 更新頁面背景與卡片配色
            elements.body.className = `font-cute min-h-screen w-full flex flex-col items-center justify-center p-4 sm:p-6 transition-colors duration-700 overflow-x-hidden select-none relative ${theme.bodyBg}`;
            elements.card.className = `relative z-10 w-full max-w-md backdrop-blur-md rounded-[2.5rem] shadow-2xl border-4 p-6 sm:p-8 flex flex-col items-center transition-all duration-500 ${theme.card}`;
            elements.greetingBadge.className = `inline-flex items-center gap-2 px-4 py-1.5 rounded-full font-bold text-sm sm:text-base shadow-sm transition-colors duration-500 ${theme.badge}`;

            elements.soundToggle.className = `p-2.5 rounded-full transition-all active:scale-90 shadow-sm ${theme.ctrlBtn}`;
            elements.formatToggle.className = `px-3 py-2 rounded-full font-extrabold text-xs sm:text-sm transition-all active:scale-90 shadow-sm ${theme.ctrlBtn}`;

            // 更新耳朵造型與顏色
            elements.earLeft.className = `w-14 h-14 sm:w-16 sm:h-16 border-4 -rotate-12 flex items-center justify-center shadow-inner transition-all duration-500 rounded-bl-3xl ${theme.earOuter}`;
            elements.earRight.className = `w-14 h-14 sm:w-16 sm:h-16 border-4 rotate-12 flex items-center justify-center shadow-inner transition-all duration-500 rounded-br-3xl ${theme.earOuter}`;
            elements.earLeftInner.className = `w-7 h-7 sm:w-8 sm:h-8 rounded-t-full rounded-bl-xl transition-colors duration-500 ${theme.earInner}`;
            elements.earRightInner.className = `w-7 h-7 sm:w-8 sm:h-8 rounded-t-full rounded-br-xl transition-colors duration-500 ${theme.earInner}`;

            // 更新錶殼與數位面板
            elements.clockBody.className = `relative w-64 h-64 sm:w-72 sm:h-72 rounded-full border-[10px] flex items-center justify-center transition-all duration-500 ${theme.clockBody}`;
            elements.clockInnerRing.className = `absolute inset-2 rounded-full border-2 border-dashed pointer-events-none transition-colors duration-500 ${theme.innerRing}`;
            elements.digitalPanel.className = `w-full rounded-3xl border-2 p-4 sm:p-5 text-center shadow-inner transition-colors duration-500 ${theme.digitalPanel}`;
            elements.digitalTime.className = `text-4xl sm:text-5xl font-black tracking-wider transition-colors duration-500 ${theme.digitalTime}`;
            elements.digitalAmpm.className = `text-sm sm:text-base font-extrabold transition-colors duration-500 ${theme.digitalSub} ${is24Hour ? 'hidden' : 'inline-block'}`;
            elements.digitalDate.className = `mt-1.5 text-sm sm:text-base font-bold opacity-90 transition-colors duration-500 ${theme.digitalSub}`;

            elements.petHint.className = `mt-2 inline-block text-xs font-bold opacity-85 group-hover:opacity-100 transition-opacity ${theme.hint}`;
            elements.themeLabel.className = `text-center text-xs font-bold mb-3 tracking-wide ${theme.hint}`;
            elements.footer.className = `relative z-10 mt-5 text-xs sm:text-sm font-bold transition-colors duration-500 ${theme.footer}`;

            // 更新 SVG 指針與表情顏色
            elements.hourHand.querySelector('line').setAttribute('stroke', theme.svg.hour);
            elements.minuteHand.querySelector('line').setAttribute('stroke', theme.svg.minute);
            elements.secondHand.querySelector('line').setAttribute('stroke', theme.svg.second);
            elements.secondHand.querySelector('circle').setAttribute('fill', theme.svg.second);
            elements.centerOuter.setAttribute('fill', theme.svg.center);
            elements.cheekLeft.setAttribute('fill', theme.svg.cheek);
            elements.cheekRight.setAttribute('fill', theme.svg.cheek);
            elements.cuteMouth.setAttribute('stroke', theme.svg.faceStroke);

            // 更新眼睛顏色
            elements.eyesNormal.querySelectorAll('circle').forEach((c, idx) => {
                if (idx % 2 === 0) c.setAttribute('fill', theme.svg.faceStroke);
            });
            elements.eyesHappy.querySelectorAll('path').forEach(p => {
                p.setAttribute('stroke', theme.svg.faceStroke);
            });

            // 重新繪製刻度
            buildClockMarkers(theme.svg);

            // 更新主題按鈕選取外框
            elements.themeBtns.forEach(btn => {
                const isSelected = btn.dataset.theme === themeKey;
                btn.classList.toggle('border-pink-400', isSelected && themeKey === 'strawberry');
                btn.classList.toggle('border-amber-400', isSelected && themeKey === 'honey');
                btn.classList.toggle('border-emerald-400', isSelected && themeKey === 'mint');
                btn.classList.toggle('border-indigo-300', isSelected && themeKey === 'night');
                btn.classList.toggle('border-transparent', !isSelected);
                btn.classList.toggle('ring-2', isSelected);
                btn.classList.toggle('ring-offset-2', isSelected);
                btn.classList.toggle('ring-pink-300', isSelected && themeKey === 'strawberry');
                btn.classList.toggle('ring-amber-300', isSelected && themeKey === 'honey');
                btn.classList.toggle('ring-emerald-300', isSelected && themeKey === 'mint');
                btn.classList.toggle('ring-indigo-400', isSelected && themeKey === 'night');
            });
        }

        // ==========================================
        // 6. 即時更新時鐘與問候語
        // ==========================================
        function updateGreeting(hour) {
            let icon = '☀️';
            let text = '早安呀！';

            if (hour >= 5 && hour < 11) {
                icon = '🌅';
                text = '早安，元氣滿滿！';
            } else if (hour >= 11 && hour < 14) {
                icon = '🍱';
                text = '午安，記得吃飯喔！';
            } else if (hour >= 14 && hour < 18) {
                icon = '🍰';
                text = '下午茶時間到～';
            } else if (hour >= 18 && hour < 22) {
                icon = '🌆';
                text = '晚安，辛苦一天囉！';
            } else {
                icon = '🌙';
                text = '夜深了，早點休息喔';
            }

            elements.greetingIcon.textContent = icon;
            elements.greetingText.textContent = text;
        }

        function updateClock() {
            try {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                const ms = now.getMilliseconds();

                // 計算滑順指針角度
                const secondDeg = (seconds + ms / 1000) * 6;
                const minuteDeg = (minutes + seconds / 60) * 6;
                const hourDeg = ((hours % 12) + minutes / 60) * 30;

                elements.secondHand.setAttribute('transform', `rotate(${secondDeg} 120 120)`);
                elements.minuteHand.setAttribute('transform', `rotate(${minuteDeg} 120 120)`);
                elements.hourHand.setAttribute('transform', `rotate(${hourDeg} 120 120)`);

                // 每秒更新一次數位文字、問候語與滴答聲
                if (seconds !== lastSecond) {
                    lastSecond = seconds;
                    playSoftTick();

                    let displayHour = hours;
                    let ampm = '';

                    if (!is24Hour) {
                        ampm = hours >= 12 ? 'PM' : 'AM';
                        displayHour = hours % 12 || 12;
                        elements.digitalAmpm.textContent = ampm;
                        elements.digitalAmpm.classList.remove('hidden');
                    } else {
                        elements.digitalAmpm.classList.add('hidden');
                    }

                    const pad = n => String(n).padStart(2, '0');
                    elements.digitalTime.textContent = `${pad(displayHour)}:${pad(minutes)}:${pad(seconds)}`;

                    const year = now.getFullYear();
                    const month = now.getMonth() + 1;
                    const date = now.getDate();
                    const weekday = WEEKDAYS_ZH[now.getDay()];
                    elements.digitalDate.textContent = `${year}年 ${month}月 ${date}日 ${weekday}`;

                    updateGreeting(hours);
                }
            } catch (err) {
                console.error('更新時鐘時發生錯誤:', err);
            }

            requestAnimationFrame(updateClock);
        }

        // ==========================================
        // 7. 摸摸時鐘互動效果
        // ==========================================
        function triggerPetReaction() {
            playHappyChime();

            // 切換成開心彎彎眼
            elements.eyesNormal.classList.add('hidden');
            elements.eyesHappy.classList.remove('hidden');

            // 產生飄浮小愛心/貼圖
            const icons = THEMES[currentThemeKey].heartIcons;
            for (let i = 0; i < 4; i++) {
                const heart = document.createElement('span');
                heart.textContent = icons[Math.floor(Math.random() * icons.length)];
                const offsetX = (Math.random() - 0.5) * 140;
                const offsetY = (Math.random() - 0.5) * 60;
                heart.className = 'absolute text-2xl sm:text-3xl animate-float-up pointer-events-none';
                heart.style.left = `calc(50% + ${offsetX}px)`;
                heart.style.top = `calc(40% + ${offsetY}px)`;
                elements.heartsContainer.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 1000);
            }

            // 恢復正常眨眼
            clearTimeout(happyTimeout);
            happyTimeout = setTimeout(() => {
                elements.eyesHappy.classList.add('hidden');
                elements.eyesNormal.classList.remove('hidden');
            }, 1400);
        }

        // ==========================================
        // 8. 事件監聽與初始化
        // ==========================================
        elements.petArea.addEventListener('click', triggerPetReaction);

        elements.formatToggle.addEventListener('click', () => {
            is24Hour = !is24Hour;
            elements.formatToggle.textContent = is24Hour ? '24H' : '12H';
            lastSecond = -1; // 強制立即刷新顯示
        });

        elements.soundToggle.addEventListener('click', () => {
            initAudioContext();
            isSoundEnabled = !isSoundEnabled;
            elements.soundIcon.textContent = isSoundEnabled ? '🔊' : '🔇';
            if (isSoundEnabled) {
                playSoftTick();
            }
        });

        elements.themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                applyTheme(btn.dataset.theme);
            });
        });

        // 啟動預設主題與時鐘動畫迴圈
        window.addEventListener('DOMContentLoaded', () => {
            applyTheme('strawberry');
            requestAnimationFrame(updateClock);
        });
    </script>
</body>
</html>
